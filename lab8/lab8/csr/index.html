<html>
    <head>
        <meta charset="utf-8"/>
        <title>Типи</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    
    </head>
    <body>
        <div class="container" id="loginContainer">
            <h1>Форма входу</h1>
            <div class="row">
                <form method="POST" id="loginForm">
                        <p>
                            <input type="text" name="login" value="" class="form-control" placeholder="Логін" required/>
                        </p>
                        <p>
                            <input type="password" name="password" value="" class="form-control" placeholder="Пароль" required/>
                        </p>
                        <p>
                            <button class="btn btn-success" type="submit">Увійти</button>
                        </p>
                        <p class="text-danger" id="loginError"></p>
                    </form>
            </div>
        </div>
        <div class="container" id="contentContainer">
            <ul class="nav">
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#typeContent">Типи</a></li>
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#purposeContent">Сфера призначення</a></li>
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#propertyContent">Характеристики</a></li>
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#saltContent">Солі</a></li>
                <li><a class="btn btn-outline nav-btn" id="logoutBtn" href="#">Вийти</a></li>
            </ul>
            <div class="tab-content" id="typeContent">
                <h1>Типи</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="typeTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="typeForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва типу" required/>
                            </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="purposeContent">
                <h1>Сфера призначення</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="purposeTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="purposeForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва сфери призначення" required/>
                            </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="propertyContent">
                <h1>Характеристики</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="propertyTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Одиниці вимірювання</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="propertyForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва характеристики" required/>
                            </p>
                            <p>
                            <input type="text" name="units" value="" class="form-control" placeholder="Одиниці вимірювання" required/>
                        </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="saltContent">
                <h1>Солі</h1>
                <div class="row">
                    <div class="col-md-8">
                            <form method="GET" id="searchForm">
                                <input type="text" required name="search" placeholder="Шукати"/>
                                <button type="submit" class="btn btn-primary">Пошук</button>
                            </form>
                        <table class="table" id="saltTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Позначення</th>
                                    <th>Тип</th>
                                    <th>Сфера призначення</th>
                                    <th>Маркування</th>
                                    <th>Характеристики</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="saltForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва" required/>
                            </p>
                            <p>
                                <input type="text" name="formula" value="" class="form-control" placeholder="Позначення" required/>
                            </p>
                            <p>
                                <select class="form-select" name="type_id" required placeholder="Тип"></select>
                            </p>
                            <p>
                                <select class="form-select" name="purpose_id" required placeholder="Сфера призначення"></select>
                            </p>
                            <p>
                                <input type="text" name="marking" value="" class="form-control" placeholder="Маркування" required/>
                            </p>
                            <div id="propertiesInputContainer"></div>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</html>
